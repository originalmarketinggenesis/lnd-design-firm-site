<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Shinobi Run</title>
<style>
  html,body{margin:0;height:100%;background:#07070f;color:#fff;font-family:"Trebuchet MS",Verdana,sans-serif}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{width:min(100vw,calc(100vh*960/544));height:auto;aspect-ratio:960/544;background:#000;touch-action:none;image-rendering:auto}
  #touch{display:none;position:fixed;inset:auto 0 0 0;padding:10px;justify-content:space-between;pointer-events:none}
  #touch .g{display:flex;gap:8px;flex-wrap:wrap;max-width:48vw;pointer-events:auto}
  #touch button{width:54px;height:54px;border-radius:50%;border:2px solid #ffffff88;background:#00000066;color:#fff;font:bold 13px sans-serif;touch-action:none}
  @media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<canvas id="c" width="960" height="544"></canvas>
<div id="touch">
  <div class="g"><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button><button data-k="Space">JUMP</button></div>
  <div class="g" style="justify-content:flex-end"><button data-k="KeyZ">Kunai</button><button data-k="KeyX">Rasen</button><button data-k="KeyC">Clone</button><button data-k="Digit1">Sage</button><button data-k="Digit2">Kyuubi</button><button data-k="Digit3">Final</button><button data-k="Enter">OK</button></div>
</div>
<script>
'use strict';
/* ====================== CONSTANTS & SETUP ====================== */
let GW = 160; const T = 32, GH = 17, VW = 960, VH = 544, GRAV = 0.6;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const keys = {}, pressed = {};
const down = c => keys[c], jp = c => pressed[c];

addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true; initAudio();
});
addEventListener('keyup', e => { keys[e.code] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (!keys[k]) pressed[k] = true; keys[k] = true; initAudio(); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => { keys[k] = false; }));
});

/* ---------- tiny synth ---------- */
let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function tone(f0, f1, d, type = 'square', vol = 0.06, delay = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const SFX = {
  jump: () => tone(300, 700, 0.12), kunai: () => tone(900, 400, 0.07, 'triangle'),
  coin: () => { tone(900, 1300, 0.08); tone(1300, 1700, 0.1, 'square', 0.05, 0.07); },
  stomp: () => tone(220, 80, 0.12, 'square', 0.08), hurt: () => tone(300, 60, 0.35, 'sawtooth', 0.1),
  ras: () => tone(150, 1000, 0.35, 'sawtooth', 0.07), rasHit: () => tone(400, 50, 0.3, 'sawtooth', 0.1),
  poof: () => tone(700, 100, 0.18, 'triangle', 0.08), power: () => { [300,450,600,900].forEach((f,i)=>tone(f,f*1.5,0.2,'sawtooth',0.07,i*0.08)); },
  brick: () => tone(180, 60, 0.15, 'square', 0.08), bump: () => tone(120, 90, 0.08, 'square', 0.06),
  boss: () => tone(90, 40, 0.5, 'sawtooth', 0.12), win: () => [523,659,784,1046].forEach((f,i)=>tone(f,f,0.25,'square',0.07,i*0.15)),
  deny: () => tone(150, 120, 0.1, 'square', 0.05),
};
const sfx = n => SFX[n] && SFX[n]();

/* ====================== FORMS ====================== */
const FORMS = {
  base:   { name: 'Naruto',            speed: 3.2, jump: 12.2, extra: 0, fly: false, need: 0,  drain: 0, rasCost: 20, rasR: 34, rasD: 4,  charge: 16, rasName: 'RASENGAN',                 kD: 1, kR: 5,  kCd: 14, kPierce: false },
  sage:   { name: 'Sage Mode',         speed: 3.8, jump: 13.2, extra: 0, fly: false, need: 25, drain: 2, rasCost: 15, rasR: 52, rasD: 7,  charge: 12, rasName: 'GIANT RASENGAN',           kD: 2, kR: 8,  kCd: 11, kPierce: false },
  kurama: { name: 'Kurama Mode',       speed: 4.6, jump: 13.2, extra: 1, fly: false, need: 50, drain: 6, rasCost: 10, rasR: 68, rasD: 11, charge: 8,  rasName: 'TAILED BEAST RASENGAN',    kD: 3, kR: 11, kCd: 9,  kPierce: true },
  baryon: { name: 'Baryon Mode',       speed: 5.4, jump: 14,   extra: 0, fly: true,  need: 90, drain: 8, rasCost: 0,  rasR: 96, rasD: 18, charge: 4,  rasName: 'PLANETARY BARYON RASENGAN', kD: 5, kR: 16, kCd: 12, kPierce: true },
};
const CLONES_BY_FORM = { base: 3, sage: 4, kurama: 5, baryon: 6 };

/* ====================== STATE ====================== */
let grid, enemies, projs, parts, items, coinsL, clones, popups, blockItems, bumps;
let P, cam, shake = 0, flash = 0, flashCol = '#fff', banner = null, state = 'title';
let level = 1, LV = null, score = 0, coinCount = 0, lives = 3, cp = 3, bossDead = false, boss = null, time = 0, hitstop = 0;

const solid = (tx, ty) => tx < 0 || tx >= GW ? true : (ty < 0 || ty >= GH ? false : (grid[ty][tx] !== 0 && grid[ty][tx] !== 7));
const rnd = (a, b) => a + Math.random() * (b - a);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ====================== LEVELS ====================== */
const LEVELS = [null,
  { name: 'Leaf Village', sub: 'Reach the scroll at the end of the village!', gw: 160, gate: 152, flag: 157, boss: 142, arena: 128, cps: [64, 103],
    night: false, eSpeed: 1.1, tCd: 100, sSpeed: 4, bossHp: 36, bossSpd: 1, regen: 5, hard: false,
    gaps: [[22,24],[43,45],[68,70],[88,92],[106,108],[120,122]] },
  { name: 'Night Raid', sub: 'Level 2 - spikes, wider gaps, faster ninja!', gw: 200, gate: 192, flag: 197, boss: 180, arena: 166, cps: [70, 125],
    night: true, eSpeed: 1.9, tCd: 55, sSpeed: 5.2, bossHp: 64, bossSpd: 1.35, regen: 3.5, hard: true,
    gaps: [[14,17],[30,34],[48,51],[58,62],[76,79],[84,88],[100,104],[112,115],[130,134],[140,143],[150,154],[162,164]] },
];
function setLevel(n) { level = n; LV = LEVELS[n]; GW = LV.gw; }

/* ====================== LEVEL ====================== */
function buildLevel() {
  grid = Array.from({ length: GH }, () => new Uint8Array(GW));
  enemies = []; projs = []; parts = []; items = []; coinsL = []; clones = []; popups = []; blockItems = {}; bumps = {};
  const gaps = LV.gaps;
  for (let x = 0; x < GW; x++) {
    if (gaps.some(g => x >= g[0] && x <= g[1])) continue;
    grid[15][x] = 1; grid[16][x] = 1;
  }
  const plat = (x, y, n, t = 2) => { for (let i = 0; i < n; i++) grid[y][x + i] = t; };
  const q = (x, y, item = 'scroll') => { grid[y][x] = 3; blockItems[x + ',' + y] = item; };
  const pipe = (x, h) => { for (let ty = 15 - h; ty < 15; ty++) { grid[ty][x] = 5; grid[ty][x + 1] = 5; } };
  const spikes = (x, n) => { for (let i = 0; i < n; i++) grid[14][x + i] = 7; };
  const row = (x, y, n) => { for (let i = 0; i < n; i++) coinsL.push({ x: (x + i) * T + 8, y: y * T + 8, w: 16, h: 16 }); };
  const arc = (x, n, y) => { for (let i = 0; i < n; i++) coinsL.push({ x: (x + i) * T + 8, y: (y - Math.sin(i / (n - 1) * Math.PI) * 2.2) * T + 8, w: 16, h: 16 }); };
  let grunts, throwers;

  if (level === 1) {
    plat(10, 11, 5); q(12, 11); q(8, 11);
    plat(16, 8, 3); q(17, 8);
    pipe(30, 2); pipe(36, 3);
    plat(33, 10, 4); q(34, 10, 'ramen');
    plat(48, 11, 6); q(50, 11); q(52, 11);
    pipe(56, 2); plat(58, 8, 4); q(59, 8);
    plat(72, 11, 4); q(73, 11);
    pipe(78, 3); plat(84, 10, 5); q(86, 10);
    plat(90, 12, 1, 5);
    pipe(98, 2); plat(100, 11, 3);
    plat(110, 10, 4); q(111, 10); q(112, 10, 'ramen');
    pipe(114, 4);
    plat(126, 11, 4); q(127, 11, 'ramen'); plat(132, 8, 3); q(133, 8);
    grunts = [14, 28, 40, 52, 62, 75, 95, 102, 116, 125];
    throwers = [20, 38, 60, 80, 104, 118, 130];
    row(11, 10, 3); row(16, 7, 3); arc(21, 5, 12); arc(42, 5, 12); row(48, 10, 5); row(58, 7, 4);
    arc(67, 5, 12); row(73, 10, 3); arc(87, 7, 12); row(100, 10, 3); arc(105, 5, 12); row(110, 9, 4);
    arc(119, 5, 12); row(126, 10, 4); row(132, 7, 3); row(137, 13, 6);
  } else {
    [[32,12],[60,11],[86,12],[102,12],[113,12],[132,12],[141,12],[152,12]].forEach(f => plat(f[0], f[1], 1, 5));   // lone stepping stones
    plat(8, 11, 3); q(9, 11);
    plat(20, 10, 3); q(21, 10);
    pipe(26, 3); pipe(44, 3);
    plat(36, 9, 4); q(37, 9, 'ramen');
    plat(54, 10, 5); q(56, 10);
    plat(66, 8, 4); q(67, 8);
    pipe(70, 3);
    plat(80, 10, 3); q(81, 10);
    plat(92, 9, 4); q(93, 9, 'ramen');
    pipe(96, 2); pipe(123, 3);
    plat(108, 10, 4); q(109, 10);
    plat(118, 9, 4); q(119, 9);
    plat(128, 10, 3);
    plat(136, 8, 4); q(137, 8, 'ramen');
    plat(148, 10, 3);
    plat(156, 9, 4); q(157, 9);
    plat(168, 10, 3); q(169, 10, 'ramen');
    [[22,3],[40,3],[64,4],[73,3],[90,3],[107,3],[118,4],[126,4],[137,3],[147,3],[158,4],[168,4]].forEach(sp => spikes(sp[0], sp[1]));
    grunts = [10, 19, 28, 38, 47, 56, 66, 74, 82, 90, 98, 106, 119, 127, 138, 148, 157, 170];
    throwers = [21, 29, 41, 53, 67, 73, 92, 108, 120, 127, 137, 144, 159, 169];
    gaps.forEach(g => arc(g[0] - 1, g[1] - g[0] + 3, 12));
    row(9, 10, 3); row(37, 8, 3); row(67, 7, 3); row(93, 8, 3); row(137, 7, 3); row(169, 9, 3);
  }
  for (let ty = 0; ty < 15; ty++) { grid[ty][LV.gate] = 6; grid[ty][LV.gate + 1] = 6; }   // seal gate (opens when boss falls)
  grunts.forEach(x => enemies.push(mkEnemy('grunt', x * T, 100)));
  throwers.forEach(x => enemies.push(mkEnemy('thrower', x * T, 100)));
  boss = mkEnemy('boss', LV.boss * T, 100); enemies.push(boss); bossDead = false;
}
function mkEnemy(type, x, y) {
  const e = { type, x, y, vx: 0, vy: 0, w: 24, h: 30, hp: 1, dir: -1, on: false, cd: rnd(30, 90), flash: 0, dead: false, t: 0 };
  if (type === 'thrower') { e.hp = LV.hard ? 3 : 2; e.cd = rnd(40, LV.tCd); }
  if (type === 'grunt' && LV.hard) e.hp = 2;
  if (type === 'boss') { e.w = 46; e.h = 62; e.hp = e.maxhp = LV.bossHp; e.cd = 100; e.mode = 'idle'; e.active = false; }
  return e;
}

/* ====================== PLAYER ====================== */
function newPlayer(x) {
  return { x, y: 11 * T, w: 22, h: 30, vx: 0, vy: 0, face: 1, on: false, hp: 5, maxhp: 5, chakra: 40, form: 'base',
    atk: 0, inv: 0, jbuf: 0, coyote: 0, jumps: 0, charge: 0, rasT: 0, rasHit: null, hist: [], anim: 0, dead: false, deadT: 0, bhp: 0, throwT: 0 };
}
function startGame() { score = 0; coinCount = 0; lives = 3; loadLevel(1); }
function loadLevel(n) {
  setLevel(n); cp = 3; time = 0;
  buildLevel(); P = newPlayer(3 * T); cam = { x: 0 }; state = 'play';
  banner = { t: 150, text: 'LEVEL ' + n + ': ' + LV.name.toUpperCase(), sub: LV.sub, col: LV.night ? '#b79cff' : '#ffb02e' };
}
function respawn() {
  const keep = { chakra: Math.max(40, P.chakra) };
  P = newPlayer(cp * T); P.y = 8 * T; P.chakra = keep.chakra; P.inv = 120; cam.x = Math.max(0, P.x - VW * 0.4);
  clones = [];
}

/* ====================== PHYSICS ====================== */
function moveX(e) {
  const dir = Math.sign(e.vx); e.x += e.vx; if (!dir) return false;
  const y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - 0.01) / T);
  const tx = Math.floor((dir > 0 ? e.x + e.w : e.x) / T);
  for (let ty = y0; ty <= y1; ty++) if (solid(tx, ty)) { e.x = dir > 0 ? tx * T - e.w : (tx + 1) * T; e.vx = 0; return true; }
  return false;
}
function moveY(e) {
  const dir = Math.sign(e.vy); e.y += e.vy; if (!dir) return null;
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - 0.01) / T);
  const ty = Math.floor((dir > 0 ? e.y + e.h : e.y) / T);
  const cx = Math.floor((e.x + e.w / 2) / T);
  let hit = -1;
  for (let tx = x0; tx <= x1; tx++) if (solid(tx, ty)) { if (hit < 0 || tx === cx) hit = tx; }
  if (hit < 0) return null;
  e.vy = 0;
  if (dir > 0) { e.y = ty * T - e.h; return { floor: true }; }
  e.y = (ty + 1) * T; return { ceil: [hit, ty] };
}

/* ====================== FX HELPERS ====================== */
function burst(x, y, n, col, sp = 3, size = 4, life = 30, grav = 0.1) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = rnd(0.3, 1) * sp;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * rnd(0.6, 1), max: life, col, size: size * rnd(0.5, 1), grav }); }
}
function poof(x, y) { burst(x, y, 14, '#f4f4f4', 3, 7, 24, -0.02); burst(x, y, 6, '#bbb', 2, 5, 24, -0.02); sfx('poof'); }
function popup(x, y, text, col = '#fff') { popups.push({ x, y, text, col, t: 50 }); }
function setBanner(text, sub, col) { banner = { t: 120, text, sub, col }; }

/* ====================== TILES / BLOCKS ====================== */
function bumpTile(tx, ty, strong) {
  const v = grid[ty] && grid[ty][tx];
  if (v === 2) {
    if (strong) { grid[ty][tx] = 0; burst(tx * T + 16, ty * T + 16, 10, '#c0703a', 4, 6, 40, 0.3); sfx('brick'); score += 50; }
    else { bumps[tx + ',' + ty] = 8; sfx('bump'); }
  } else if (v === 3) {
    grid[ty][tx] = 4; bumps[tx + ',' + ty] = 8; sfx('bump');
    const kind = blockItems[tx + ',' + ty] || 'scroll';
    items.push({ type: kind, x: tx * T + 8, y: ty * T - 18, w: 16, h: 16, vx: 1.2, vy: -6, life: 900 });
  }
}

/* ====================== ATTACKS ====================== */
function fireKunai(x, y, dir, form, ay = 0) {
  const F = FORMS[form];
  projs.push({ type: form === 'baryon' ? 'beam' : form === 'kurama' ? 'bolt' : 'kunai', x, y, vx: dir * (form === 'baryon' ? 13 : 9), vy: ay, r: F.kR, dmg: F.kD,
    friendly: true, life: 70, pierce: F.kPierce, hit: new Set(), rot: 0, form });
}
function startRasengan() {
  const F = FORMS[P.form];
  if (P.charge || P.rasT) return;
  if (P.chakra < F.rasCost) { sfx('deny'); popup(P.x, P.y - 10, 'NO CHAKRA', '#9cf'); return; }
  P.chakra -= F.rasCost; P.charge = F.charge; P.chargeMax = F.charge; sfx('ras');
  setBanner(F.rasName + '!', '', P.form === 'baryon' ? '#ff6a2a' : '#6ec8ff');
  banner.t = 50; banner.small = true;
}
function releaseRasengan() {
  const F = FORMS[P.form];
  P.rasT = 20; P.rasHit = new Set(); P.vx = P.face * (8 + P.form.length * 0.3); P.vy = Math.min(P.vy, -1);
  shake = Math.max(shake, 5); sfx('rasHit');
  clones.forEach(c => { c.ras = 20; c.rasHit = new Set(); });
}
function rasArea(cx, cy, r, dmg, hitSet, face) {
  for (const e of enemies) {
    if (e.dead || hitSet.has(e)) continue;
    const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
    if (Math.hypot(ex - cx, ey - cy) < r + Math.max(e.w, e.h) / 2) {
      hitSet.add(e); damageEnemy(e, dmg, face * 6); burst(ex, ey, 14, '#8fd8ff', 5, 5, 25, 0.05); hitstop = 4;
    }
  }
  for (const p of projs) if (!p.friendly && Math.hypot(p.x - cx, p.y - cy) < r + 10) { p.life = 0; burst(p.x, p.y, 6, '#8fd8ff', 3, 4, 15); }
  const x0 = Math.floor((cx - r) / T), x1 = Math.floor((cx + r) / T), y0 = Math.floor((cy - r) / T), y1 = Math.floor((cy + r) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const v = grid[ty] && grid[ty][tx];
    if ((v === 2 || v === 3) && Math.hypot(tx * T + 16 - cx, ty * T + 16 - cy) < r + 14) bumpTile(tx, ty, true);
  }
}
function damageEnemy(e, d, kx = 0) {
  if (e.dead) return;
  e.hp -= d; e.flash = 6; e.vx = kx;
  if (e.type === 'boss') { shake = Math.max(shake, 4); sfx('rasHit'); }
  if (e.hp <= 0) killEnemy(e);
  else sfx('stomp');
}
function killEnemy(e) {
  e.dead = true; score += e.type === 'boss' ? 2000 : 100;
  poof(e.x + e.w / 2, e.y + e.h / 2); burst(e.x + e.w / 2, e.y + e.h / 2, 12, '#ffb02e', 4, 5, 30, 0.2);
  popup(e.x, e.y - 8, '+' + (e.type === 'boss' ? 2000 : 100), '#ffe066');
  if (e.type === 'grunt' || e.type === 'thrower') coinsL.push({ x: e.x + 4, y: e.y, w: 16, h: 16 });
  if (e.type === 'boss') {
    bossDead = true; shake = 24; flash = 30; flashCol = '#fff'; sfx('boss');
    for (let ty = 0; ty < 15; ty++) { grid[ty][LV.gate] = 0; grid[ty][LV.gate + 1] = 0; burst(LV.gate * T + 32, ty * T + 16, 4, '#c8a2ff', 3, 6, 40, 0.05); }
    setBanner('SEAL BROKEN!', 'Grab the scroll to finish the mission!', '#c8a2ff');
  }
}
function hurtPlayer(fromX) {
  if (P.inv > 0 || P.dead || P.form === 'baryon' && P.hp > 0 && false) return;
  P.hp--; P.inv = 100; shake = 8; sfx('hurt'); hitstop = 5;
  P.vy = -6; P.vx = (P.x < fromX ? -1 : 1) * 4;
  burst(P.x + 11, P.y + 15, 10, '#ff4040', 4, 4, 25, 0.2);
  if (P.hp <= 0) { P.dead = true; P.deadT = 0; P.vy = -11; P.vx = 0; P.form = 'base'; }
}
function setForm(name) {
  if (P.dead) return;
  if (P.form === name) { P.form = 'base'; poof(P.x + 11, P.y + 15); return; }
  const F = FORMS[name];
  if (P.chakra < F.need) { sfx('deny'); popup(P.x - 14, P.y - 14, 'NEED ' + F.need + ' CHAKRA', '#9cf'); return; }
  P.form = name; sfx('power'); shake = 10; flash = name === 'baryon' ? 24 : 12; P.bhp = 0;
  flashCol = { sage: '#ffd27a', kurama: '#ffe35a', baryon: '#ff6a2a' }[name];
  burst(P.x + 11, P.y + 15, 40, flashCol, 6, 6, 40, -0.05);
  const msg = { sage: ['SAGE MODE', 'Nature energy flows through you', '#ff9a3c'], kurama: ['KURAMA MODE', 'Double jump · golden chakra cloak', '#ffd51a'],
    baryon: ['BARYON MODE', 'Final form · fly with JUMP · drains your life!', '#ff5a1f'] }[name];
  setBanner(msg[0], msg[1], msg[2]);
}
function summonClones() {
  if (P.chakra < 30) { sfx('deny'); popup(P.x - 10, P.y - 14, 'NEED 30 CHAKRA', '#9cf'); return; }
  P.chakra -= 30; clones = [];
  const n = CLONES_BY_FORM[P.form];
  for (let i = 0; i < n; i++) { clones.push({ i, life: 540, cd: 20 + i * 8, x: P.x, y: P.y, face: P.face, ras: 0, throwT: 0, on: true }); }
  popup(P.x - 20, P.y - 20, 'SHADOW CLONE JUTSU!', '#fff');
  sfx('poof'); shake = 4;
  clones.forEach(c => { const h = histAt((c.i + 1) * 12); poof(h.x + 11, h.y + 15); });
}
const histAt = i => P.hist.length ? P.hist[Math.min(i, P.hist.length - 1)] : { x: P.x, y: P.y, face: P.face, on: true };

/* ====================== UPDATE: PLAYER ====================== */
function updatePlayer() {
  const F = FORMS[P.form];
  if (P.dead) {
    P.deadT++; P.vy += GRAV; P.y += P.vy;
    if (P.deadT > 100) { lives--; if (lives < 0) { state = 'over'; } else respawn(); }
    return;
  }
  const L = down('ArrowLeft') || down('KeyA'), R = down('ArrowRight') || down('KeyD');

function drawProj(p) {
  ctx.save(); ctx.translate(p.x, p.y);
  if (p.type === 'kunai') {
    ctx.rotate(Math.atan2(p.vy, p.vx));
    ctx.fillStyle = p.form === 'sage' ? '#9dffa0' : '#cfd8e3'; ctx.fillRect(-8, -2, 16, 4);
    ctx.fillStyle = '#444'; ctx.fillRect(-12, -1.5, 5, 3);

  } else if (p.type === 'bolt') {
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, p.r * 1.6); g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#ffd51a'); g.addColorStop(1, 'rgba(255,170,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, p.r * 1.6, 0, 7); ctx.fill();

function drawWorld() {

/* ====================== LOOP ====================== */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); for (const k in pressed) delete pressed[k]; acc -= 1000 / 60; }
  render(); requestAnimationFrame(frame);
}
